<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nöronun Yapısı 3B</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css?v=20260829-neuron4" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="viewer-shell" id="app">
      <canvas id="scene" aria-label="Nöron yapısını etkileşimli olarak inceleyebileceğiniz 3D model"></canvas>
      <div class="hotspot-layer" id="hotspotLayer" aria-label="İşaretler"></div>

      <aside class="section-rail" aria-label="Kısımlar">
        <button class="section-button" id="sectionButton1" type="button" aria-label="1. Kısım">
          <img id="sectionButtonImage1" alt="" />
        </button>
        <button class="section-button" id="sectionButton2" type="button" aria-label="2. Kısım">
          <img id="sectionButtonImage2" alt="" />
        </button>
      </aside>

      <div class="top-actions" aria-label="Araçlar">
        <button class="tool-button" id="refreshButton" type="button" aria-label="Yenile">
          <img id="refreshIcon" alt="" />
        </button>
        <button class="tool-button" id="soundButton" type="button" aria-label="Ses">
          <img id="soundIcon" alt="" />
        </button>
        <button class="tool-button" id="shareButton" type="button" aria-label="Paylaş">
          <img id="shareIcon" alt="" />
        </button>
        <button class="tool-button" id="fullscreenButton" type="button" aria-label="Tam ekran">
          <img id="fullscreenIcon" alt="" />
        </button>
      </div>

      <aside class="info-card" id="infoCard" aria-label="Kart">
        <button class="card-close" id="cardClose" type="button" aria-label="Kartı kapat">×</button>

        <figure class="card-frame">
          <img id="cardImage" alt="" />
          <div class="card-fallback hidden" id="cardFallback">
            <div class="card-fallback-mark">
              <img id="cardEmblem" alt="" />
            </div>
            <h2 id="cardFallbackTitle">Kart</h2>
            <p id="cardFallbackDesc"></p>
          </div>
        </figure>

      </aside>

      <section class="loading-overlay" id="loadingOverlay" aria-live="polite">
        <div class="loading-card">
          <div class="loading-mark"></div>
          <h2>3D model hazırlanıyor</h2>
          <p id="loadingText">Nöron modeli yükleniyor</p>
          <div class="loading-bar"><span id="loadingBar"></span></div>
        </div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="sr-only" id="liveRegion" aria-live="polite"></div>
    </main>

    <script type="module" src="./viewer.js?v=20260829-neuron4"></script>
  </body>
</html>
